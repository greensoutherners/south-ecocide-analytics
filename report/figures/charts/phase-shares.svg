<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 458" width="1000" height="458" role="img" aria-labelledby="desc">
<desc id="desc">Four 100% bars, one for each category of record, split into three phases: 1 March to 17 April, 18 April to 14 June, 15 June to 14 October 2026. A grey bar on top shows the phases' share of the window's days, and dashed lines carry its breaks down the chart. Each category is read alone; categories are never added together.</desc>
<style>svg{fill:#1f2220}text{font-family:Inter, "Segoe UI", system-ui, sans-serif}.h{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}</style>
