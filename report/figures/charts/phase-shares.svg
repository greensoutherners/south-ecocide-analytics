<g class="text">
<text x="940" y="22" font-size="12.5" fill="#4b4e4c" text-anchor="end">Share of each category's own records in each phase</text>
<text x="367.37" y="64" font-size="13.5" font-weight="600" text-anchor="middle">1 March to 17 April</text>
<text x="516.14" y="64" font-size="13.5" font-weight="600" text-anchor="middle">18 April to 14 June</text>
<text x="768.77" y="64" font-size="13.5" font-weight="600" text-anchor="middle">15 June to 14 October</text>
<text x="367.37" y="93.42" font-size="13" font-weight="600" fill="#1f2220" text-anchor="middle">48 days, 21%</text>
<text x="516.14" y="93.42" font-size="13" font-weight="600" fill="#1f2220" text-anchor="middle">58 days, 25%</text>
<text x="768.77" y="93.42" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">122 days, 54%</text>
<text x="16" y="86" font-size="14.5" font-weight="700">Length of each phase</text>
<text x="16" y="103" font-size="12.5" fill="#4b4e4c">228 days in the window</text>
<text x="431.47" y="169.42" font-size="13" font-weight="600" fill="#1f2220" text-anchor="middle">41%</text>
<text x="750.1" y="169.42" font-size="13" font-weight="600" fill="#1f2220" text-anchor="middle">58%</text>
<text x="946" y="169.42" font-size="13" font-weight="600" fill="#4b4e4c">0.4%</text>
<text x="32.44" y="162" font-size="14.5" font-weight="700">Evacuation orders</text>
<text x="32.44" y="179" font-size="12.5" fill="#4b4e4c">701 recorded, each a town or region</text>
<text x="450" y="233.42" font-size="13" font-weight="600" fill="#1f2220" text-anchor="middle">47%</text>
<text x="710" y="233.42" font-size="13" font-weight="600" fill="#1f2220" text-anchor="middle">34%</text>
<text x="880" y="233.42" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">19%</text>
<text x="32.44" y="226" font-size="14.5" font-weight="700">White phosphorus attacks</text>
<text x="32.44" y="243" font-size="12.5" fill="#4b4e4c">128 reported</text>
<text x="319.87" y="325" font-size="13" font-weight="600" fill="#4b4e4c" text-anchor="middle">6.2%</text>
<text x="393.66" y="297.42" font-size="13" font-weight="600" fill="#1f2220" text-anchor="middle">17%</text>
<text x="693.79" y="297.42" font-size="13" font-weight="600" fill="#1f2220" text-anchor="middle">77%</text>
<text x="32.44" y="290" font-size="14.5" font-weight="700">Fires</text>
<text x="32.44" y="307" font-size="12.5" fill="#4b4e4c">451 in the published scope</text>
<text x="316.41" y="389" font-size="13" font-weight="600" fill="#4b4e4c" text-anchor="middle">5.1%</text>
<text x="368.72" y="361.42" font-size="13" font-weight="600" fill="#1f2220" text-anchor="middle">11%</text>
<text x="672.31" y="361.42" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">84%</text>
<text x="32.44" y="354" font-size="14.5" font-weight="700">Detonations and demolitions</text>
<text x="32.44" y="371" font-size="12.5" fill="#4b4e4c">624 reported</text>
<text x="16" y="418" font-size="12.5" fill="#828282">Dashed lines carry the phases' share of the window's days down the chart: a category spread evenly over the window would break at them. The middle phase</text>
<text x="16" y="434.88" font-size="12.5" fill="#828282">ends with the week of 8 June, the last holding 10 or more evacuation orders recorded.</text>
</g>
</svg>
