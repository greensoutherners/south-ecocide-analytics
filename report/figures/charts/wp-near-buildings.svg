<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 386" width="1000" height="386" role="img" aria-labelledby="desc">
<desc id="desc">Paired horizontal bars for two distances, 100 m and 250 m: the share of 34 geolocated white phosphorus attack points with a mapped building within the distance, against the share of random points on the land of the same localities. The attack share is higher at both distances; the p value of each one-sided test is given beside it.</desc>
<style>svg{fill:#1f2220}text{font-family:Inter, "Segoe UI", system-ui, sans-serif}.h{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.tn{font-variant-numeric:tabular-nums}</style>
<rect width="1000" height="386" fill="#ffffff"/>
<g class="grid">
<line x1="204" y1="84" x2="204" y2="288" stroke="#c3c2b7" stroke-width="1"/>
<line x1="361" y1="84" x2="361" y2="288" stroke="#e4e4e4" stroke-width="1"/>
<line x1="518" y1="84" x2="518" y2="288" stroke="#e4e4e4" stroke-width="1"/>
<line x1="675" y1="84" x2="675" y2="288" stroke="#e4e4e4" stroke-width="1"/>
<line x1="832" y1="84" x2="832" y2="288" stroke="#e4e4e4" stroke-width="1"/>
</g>
<g class="marks">
<rect x="204" y="92" width="406.38" height="34" fill="#d6336c"/>
<rect x="204" y="132" width="320.53" height="34" fill="#8c8e8c"/>
<rect x="204" y="208" width="554.15" height="34" fill="#d6336c"/>
<rect x="204" y="248" width="485.19" height="34" fill="#8c8e8c"/>
</g>
<g class="text">
<rect x="16" y="13.64" width="11" height="11" rx="1.5" fill="#d6336c"/>
<text x="32" y="24" font-size="13.5" fill="#4b4e4c">Geolocated attacks: the 34 of 35 that lie inside a locality</text>
<rect x="422.2" y="13.64" width="11" height="11" rx="1.5" fill="#8c8e8c"/>
<text x="438.2" y="24" font-size="13.5" fill="#4b4e4c">Random points on the land of the same localities</text>
<text x="16" y="56" font-size="12.5" fill="#4b4e4c">Share of points with a mapped building within the distance</text>
<text x="204" y="306" font-size="13" fill="#828282" text-anchor="middle" class="tn">0%</text>
<text x="361" y="306" font-size="13" fill="#828282" text-anchor="middle" class="tn">25%</text>
<text x="518" y="306" font-size="13" fill="#828282" text-anchor="middle" class="tn">50%</text>
<text x="675" y="306" font-size="13" fill="#828282" text-anchor="middle" class="tn">75%</text>
<text x="832" y="306" font-size="13" fill="#828282" text-anchor="middle" class="tn">100%</text>
<text x="617.38" y="113.92" class="h"><tspan font-size="14.5" font-weight="700">65%</tspan><tspan dx="8" font-size="12.5" fill="#4b4e4c">14 percentage points higher</tspan></text>
<text x="531.53" y="153.92" font-size="14.5" font-weight="700" fill="#4b4e4c" class="h tn">51%</text>
<text x="16" y="120" font-size="14.5" font-weight="700">Within 100 m</text>
<text x="16" y="137" font-size="13.5" fill="#4b4e4c">of a mapped building</text>
<text x="16" y="155" font-size="12.5" fill="#828282">one-sided test: p = 0.08</text>
<text x="765.15" y="229.92" class="h"><tspan font-size="14.5" font-weight="700">88%</tspan><tspan dx="8" font-size="12.5" fill="#4b4e4c">11 percentage points higher</tspan></text>
<text x="696.19" y="269.92" font-size="14.5" font-weight="700" fill="#4b4e4c" class="h tn">77%</text>
<text x="16" y="236" font-size="14.5" font-weight="700">Within 250 m</text>
<text x="16" y="253" font-size="13.5" fill="#4b4e4c">of a mapped building</text>
<text x="16" y="271" font-size="12.5" fill="#828282">one-sided test: p = 0.09</text>
<text x="16" y="342" font-size="12.5" fill="#828282">Buildings: OpenStreetMap footprints. Localities: cells drawn round each locality's point, not a cadastre. Random points are drawn in every locality that holds a</text>
<text x="16" y="358.88" font-size="12.5" fill="#828282">geolocated attack, each locality weighted by its attacks.</text>
</g>
</svg>
