<line x1="900" y1="416" x2="900" y2="494" stroke="#e4e4e4" stroke-width="1"/>
</g>
<g class="marks">
<rect x="16" y="19.56" width="10.44" height="10.44" rx="1.5" fill="#d6336c"/>
<rect x="290" y="42" width="309.27" height="17" fill="#d6336c"/>
<rect x="290" y="65" width="547.11" height="17" fill="#e789aa"/>
