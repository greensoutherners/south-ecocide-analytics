<g class="text">
<text x="290" y="512" font-size="13" fill="#828282" text-anchor="middle" class="tn">0%</text>
<text x="442.5" y="512" font-size="13" fill="#828282" text-anchor="middle" class="tn">25%</text>
<text x="595" y="512" font-size="13" fill="#828282" text-anchor="middle" class="tn">50%</text>
<text x="747.5" y="512" font-size="13" fill="#828282" text-anchor="middle" class="tn">75%</text>
<text x="900" y="512" font-size="13" fill="#828282" text-anchor="middle" class="tn">100%</text>
<text x="595" y="534" font-size="13.5" fill="#4b4e4c" text-anchor="middle">Share of the kind's own sources or records</text>
<text x="32.44" y="30"><tspan font-size="14.5" font-weight="700">White phosphorus attacks</tspan><tspan dx="9" font-size="13.5" fill="#4b4e4c">572 sources cited on 127 of 128 records</tspan></text>
<text x="280" y="55" font-size="13.5" fill="#1f2220" text-anchor="end">Sources archived</text>
<text x="605.27" y="55" font-size="13" font-weight="600" class="tn">51%</text>
<text x="280" y="78" font-size="13.5" fill="#1f2220" text-anchor="end">Sources hashed</text>
<text x="843.11" y="78" font-size="13" font-weight="600" class="tn">90%</text>
<text x="280" y="101" font-size="13.5" fill="#1f2220" text-anchor="end">Records with a photo or video</text>
<text x="648.64" y="101" font-size="13" font-weight="600" class="tn">58%</text>
<text x="32.44" y="141"><tspan font-size="14.5" font-weight="700">Fires</tspan><tspan dx="9" font-size="13.5" fill="#4b4e4c">676 sources cited on 324 of 565 records</tspan></text>
<text x="280" y="166" font-size="13.5" fill="#1f2220" text-anchor="end">Sources archived</text>
<text x="904.17" y="166" font-size="13" font-weight="600" class="tn">&gt;99%</text>
<text x="280" y="189" font-size="13.5" fill="#1f2220" text-anchor="end">Sources hashed</text>
<text x="904.17" y="189" font-size="13" font-weight="600" class="tn">&gt;99%</text>
<text x="280" y="212" font-size="13.5" fill="#1f2220" text-anchor="end">Records with a photo or video</text>
<text x="304.66" y="212" font-size="13" font-weight="600" class="tn">1.4%</text>
<text x="280" y="235" font-size="13.5" fill="#1f2220" text-anchor="end">Seen by a satellite sensor</text>
<text x="584.29" y="235" font-size="13" font-weight="600" class="tn">47%</text>
<text x="280" y="258" font-size="13.5" fill="#1f2220" text-anchor="end">Burned ground seen, no detection</text>
<text x="426.66" y="258" font-size="13" font-weight="600" class="tn">21%</text>
<text x="32.44" y="298"><tspan font-size="14.5" font-weight="700">Detonations and demolitions</tspan><tspan dx="9" font-size="13.5" fill="#4b4e4c">2,395 sources cited on 614 of 624 records</tspan></text>
<text x="280" y="323" font-size="13.5" fill="#1f2220" text-anchor="end">Sources archived</text>
<text x="536.16" y="323" font-size="13" font-weight="600" class="tn">39%</text>
<text x="280" y="346" font-size="13.5" fill="#1f2220" text-anchor="end">Sources hashed</text>
<text x="770.27" y="346" font-size="13" font-weight="600" class="tn">78%</text>
<text x="280" y="369" font-size="13.5" fill="#1f2220" text-anchor="end">Records with a photo or video</text>
<text x="638.15" y="369" font-size="13" font-weight="600" class="tn">56%</text>
<text x="32.44" y="409"><tspan font-size="14.5" font-weight="700">Displacement orders</tspan><tspan dx="9" font-size="13.5" fill="#4b4e4c">698 sources cited on 698 of 701 records</tspan></text>
<text x="280" y="434" font-size="13.5" fill="#1f2220" text-anchor="end">Sources archived</text>
<text x="906" y="434" font-size="13" font-weight="600" class="tn">100%</text>
<text x="280" y="457" font-size="13.5" fill="#1f2220" text-anchor="end">Sources hashed</text>
<text x="906" y="457" font-size="13" font-weight="600" class="tn">100%</text>
<text x="280" y="480" font-size="13.5" fill="#1f2220" text-anchor="end">Records with the order's image or video</text>
<text x="818.1" y="480" font-size="13" font-weight="600" class="tn">86%</text>
<text x="16" y="560" font-size="12.5" fill="#828282">Archived: a public archive copy is stored; hashed: the SHA-256 of our captured copy is stored. Fires seen by a sensor and fires with burned ground but no</text>
<text x="16" y="576.88" font-size="12.5" fill="#828282">detection do not overlap; a displacement order's image or video is the one its announcement carried.</text>
