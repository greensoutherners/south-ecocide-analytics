<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 586" width="1000" height="586" role="img" aria-labelledby="desc">
<desc id="desc">Four panels, one for each kind, white phosphorus attacks, fires, detonations and demolitions, and displacement orders, each with horizontal bars from 0 to 100%: the share of its cited sources archived and hashed, the share of its records holding a photograph or video and, for fires, the share seen by a satellite sensor and the share with burned ground seen but no detection. Each panel is read alone.</desc>
<style>svg{fill:#1f2220}text{font-family:Inter, "Segoe UI", system-ui, sans-serif}.h{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.tn{font-variant-numeric:tabular-nums}</style>
