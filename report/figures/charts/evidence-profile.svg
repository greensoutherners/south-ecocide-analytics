<line x1="595" y1="305" x2="595" y2="378" stroke="#e4e4e4" stroke-width="1"/>
<line x1="595" y1="416" x2="595" y2="494" stroke="#e4e4e4" stroke-width="1"/>
<line x1="747.5" y1="37" x2="747.5" y2="110" stroke="#e4e4e4" stroke-width="1"/>
<line x1="747.5" y1="148" x2="747.5" y2="267" stroke="#e4e4e4" stroke-width="1"/>
<line x1="747.5" y1="305" x2="747.5" y2="378" stroke="#e4e4e4" stroke-width="1"/>
<line x1="747.5" y1="416" x2="747.5" y2="494" stroke="#e4e4e4" stroke-width="1"/>
