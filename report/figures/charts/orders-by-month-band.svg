<desc id="desc">Stacked bars of evacuation order records per month, March to October 2026, split by where the named town's gazetteer point lies: south of the Litani, between the Litani and the Zahrani, north of the Zahrani in the South and Nabatieh governorates, elsewhere in Lebanon, a town with no point, or no town. A vertical line marks the ceasefire and the yellow line of 17 and 18 April.</desc>
