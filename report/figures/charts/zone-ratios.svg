<rect x="16" y="152.49" width="10.44" height="10.44" rx="1.5" fill="#d6336c"/>
<rect x="428.25" y="141.5" width="117.06" height="15" fill="#d9a400"/>
<rect x="488.45" y="159.5" width="56.86" height="15" fill="#8c8e8c"/>
<rect x="16" y="204.56" width="10.44" height="10.44" rx="1.5" fill="#f76707"/>
<rect x="545.31" y="201.5" width="136.18" height="15" fill="#d9a400"/>
<rect x="545.31" y="219.5" width="34.35" height="15" fill="#8c8e8c"/>
