<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 472" width="1000" height="472" role="img" aria-labelledby="desc">
<desc id="desc">Paired horizontal bars on a log scale: for each kind, its weekly rate from 18 April divided by its weekly rate before, inside the yellow-line zone and outside it in the South and Nabatieh governorates. Bars run left of the no-change line for a fall and right of it for a rise; each ratio is labelled with the weekly rates before and after.</desc>
<style>svg{fill:#1f2220}text{font-family:Inter, "Segoe UI", system-ui, sans-serif}.h{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.tn{font-variant-numeric:tabular-nums}</style>
<rect width="1000" height="472" fill="#ffffff"/>
<g class="grid">
<line x1="299.58" y1="78" x2="299.58" y2="368" stroke="#e4e4e4" stroke-width="1"/>
<line x1="356.43" y1="78" x2="356.43" y2="368" stroke="#e4e4e4" stroke-width="1"/>
<line x1="413.29" y1="78" x2="413.29" y2="368" stroke="#e4e4e4" stroke-width="1"/>
<line x1="488.45" y1="78" x2="488.45" y2="368" stroke="#e4e4e4" stroke-width="1"/>
<line x1="602.16" y1="78" x2="602.16" y2="368" stroke="#e4e4e4" stroke-width="1"/>
<line x1="677.33" y1="78" x2="677.33" y2="368" stroke="#e4e4e4" stroke-width="1"/>
<line x1="734.18" y1="78" x2="734.18" y2="368" stroke="#e4e4e4" stroke-width="1"/>
</g>
