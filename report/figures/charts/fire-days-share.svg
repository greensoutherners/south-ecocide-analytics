<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 456" width="1000" height="456" role="img" aria-labelledby="desc">
<desc id="desc">Grouped bars per month, March to October: the share of days with at least one NASA FIRMS fire detection in the collection rings, before the war (2019 to 2023) against 2026. March 7.7% before the war, 3.2% in 2026; April 14% before the war, 17% in 2026; May 16% before the war, 26% in 2026; June 31% before the war, 47% in 2026; July 37% before the war, 87% in 2026; August 37% before the war, 90% in 2026; September 49% before the war, 70% in 2026; October 28% before the war, 31% in 2026.</desc>
