<desc id="desc">Four lanes sharing one weekly time axis, from the week of 2 March to the week of 12 October 2026: evacuation orders, white phosphorus attacks, fires in the published scope with the part linked to an attack shaded, and detonations and demolitions. Each lane has its own scale and its peak is labelled. A vertical line marks the ceasefire and the yellow line of 17 and 18 April.</desc>
