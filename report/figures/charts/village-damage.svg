<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-labelledby="desc">
<desc id="desc">Horizontal bars for 10 towns, sorted by buildings destroyed: the buildings in each town's own territory first seen destroyed (dark) and damaged (light) on satellite pictures between 1 March to 14 October 2026. Beside each bar, the two counts, and the share of the mapped buildings of the town and the ground round it seen destroyed, damaged or changed on the newest pictures, at any date.</desc>
