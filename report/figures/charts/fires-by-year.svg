<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 452" width="1000" height="452" role="img" aria-labelledby="desc">
<desc id="desc">Two bar charts, one bar per year from 2019 to 2026, over the same days every year. Left: VIIRS Suomi NPP thermal detections from 1 March to 14 October (2019 102, 2020 127, 2021 99, 2022 49, 2023 73, 2024 361, 2025 84, 2026 334), with the pre-war mean of 90. Right: hectares EFFIS mapped in polygons of 30 ha and above from 1 March to 15 September (2019 253, 2020 125, 2021 202, 2022 80, 2023 322, 2024 5,366, 2025 393, 2026 6,495), with the pre-war mean of 196 ha. Pre-war years grey, 2024 and 2026 orange, 2025 mid grey.</desc>
